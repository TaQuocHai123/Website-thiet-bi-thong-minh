# Chatbot Modal HTML
<!-- Thêm vào layout-user.html hoặc file template chính -->

<!-- Chatbot Button (Help Button) -->
<div class="chatbot-help-button-container">
    <button id="chatbot-help-btn" class="chatbot-help-button" title="Trợ giúp - Mở Chatbot">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path
                d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5 7.67 11 8.5 11zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z">
            </path>
        </svg>
        Trợ giúp
    </button>
</div>

<!-- Chatbot Modal -->
<div class="chatbot-modal" id="chatbot-modal">
    <div class="chatbot-container">
        <!-- Header -->
        <div class="chatbot-header">
            <div class="chatbot-header-content">
                <h3 class="chatbot-title">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    AI Assistant
                </h3>
                <span class="chatbot-status-badge">Online</span>
            </div>
            <button class="chatbot-close-btn" id="chatbot-close-btn">&times;</button>
        </div>

        <!-- Chat Messages -->
        <div class="chatbot-messages" id="chatbot-messages">
            <div class="chatbot-message bot-message">
                <div class="message-content">
                    <p>Xin chào! 👋 Tôi là trợ lý AI của cửa hàng. Tôi có thể giúp bạn:</p>
                    <ul class="suggestions-list">
                        <li>💬 Trả lời các câu hỏi về sản phẩm</li>
                        <li>🛍️ Gợi ý sản phẩm phù hợp</li>
                        <li>📦 Hỗ trợ đặt hàng</li>
                        <li>🚚 Thông tin giao hàng</li>
                    </ul>
                    <p style="margin-top: 10px;">Hãy nhập câu hỏi của bạn dưới đây 👇</p>
                </div>
                <span class="message-time" data-time="now">Ngay bây giờ</span>
            </div>
        </div>

        <!-- Input Area -->
        <div class="chatbot-input-area">
            <!-- Quick option buttons (always visible) -->
            <div class="chatbot-quick-options" id="chatbot-quick-options">
                <button class="quick-option" data-type="order">Phương thức đặt hàng</button>
                <button class="quick-option" data-type="contact">Phương thức liên hệ</button>
                <button class="quick-option" data-type="address">Địa chỉ cửa hàng</button>
            </div>
            <div class="chatbot-tabs">
                <button class="tab-btn active" data-tab="chat">💬 Chat</button>
                <button class="tab-btn" data-tab="recommend">🛍️ Sản phẩm</button>
            </div>

            <div class="chat-tab active" id="chat-tab">
                <form class="chatbot-form" id="chatbot-message-form">
                    <div class="input-group">
                        <input type="text" class="chatbot-input" id="chatbot-input"
                            placeholder="Nhập câu hỏi của bạn..." autocomplete="off">
                        <button type="submit" class="send-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>

            <div class="chat-tab" id="recommend-tab">
                <form class="chatbot-form" id="chatbot-recommend-form">
                    <div class="input-group">
                        <input type="text" class="chatbot-input" id="chatbot-recommend-input"
                            placeholder="VD: Tôi cần sản phẩm cho..." autocomplete="off">
                        <button type="submit" class="send-btn">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                                fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                stroke-linejoin="round">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
